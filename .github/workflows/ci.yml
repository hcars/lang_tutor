name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Rust Backend Tests & Quality Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Run Cargo Format Check
        run: cargo fmt --check

      - name: Run Cargo Clippy Linter
        run: cargo clippy -- -D warnings

      - name: Run Cargo Tests (Rocket API & Unit Tests)
        run: cargo test --verbose

  frontend-tests:
    name: React + Vite + Bun Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Frontend Dependencies
        run: bun install --frozen-lockfile

      - name: Run Frontend Tests (Bun Test)
        run: bun test

      - name: Run Typecheck & Build Check
        run: bun run build
