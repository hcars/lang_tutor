services:
  postgres:
    image: postgres:16-alpine
    container_name: Lang_app_db
    environment:
      POSTGRES_USER: Lang_user
      POSTGRES_PASSWORD: Lang_password
      POSTGRES_DB: Lang_app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
